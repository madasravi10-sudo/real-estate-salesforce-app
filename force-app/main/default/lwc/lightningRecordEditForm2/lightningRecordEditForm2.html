<template>
    <lightning-card title="Record Edit Form 2" icon-name="standard:account">
        <div class="slds-m-around_medium">
            <lightning-record-edit-form
                record-id={recordId}
                object-api-name={objectApiName}
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}>

                <lightning-messages></lightning-messages>

                <lightning-input-field field-name={nameField}></lightning-input-field>
                <lightning-input-field field-name={phoneField}></lightning-input-field>
                <lightning-input-field field-name={industryField}></lightning-input-field>

                <lightning-button class="slds-m-top_small" variant="brand" type="submit" label="Update"></lightning-button>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
