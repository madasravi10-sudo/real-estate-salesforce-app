<template>
    <lightning-card title="Bulk Contact Creation">

        <template for:each={contacts} for:item="contact" for:index="index">
            <div key={contact.key} class="slds-grid slds-gutters slds-m-bottom_small">

                <lightning-input
                    label="First Name"
                    name="FirstName"
                    data-index={index}
                    value={contact.FirstName}
                    onchange={handleChange}>
                </lightning-input>

                <lightning-input
                    label="Last Name"
                    name="LastName"
                    data-index={index}
                    value={contact.LastName}
                    onchange={handleChange}>
                </lightning-input>

                <lightning-input
                    label="Email"
                    name="Email"
                    type="email"
                    data-index={index}
                    value={contact.Email}
                    onchange={handleChange}>
                </lightning-input>

            </div>
        </template>

    </lightning-card>
</template>
