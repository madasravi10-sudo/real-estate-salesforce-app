<template>
    <lightning-card title="Search Accounts" icon-name="standard:account">
        <div class="slds-p-around_medium">

            <lightning-input
                label="Search Account"
                type="search"
                onchange={handleSearch}>
            </lightning-input>

            <template if:true={accounts}>
                <template for:each={accounts} for:item="acc">
                    <p key={acc.Id} class="slds-box slds-m-top_small">
                        <strong>{acc.Name}</strong><br/>
                        Industry: {acc.Industry}<br/>
                        Phone: {acc.Phone}
                    </p>
                </template>
            </template>

            <template if:true={noResult}>
                <p class="slds-text-color_error slds-m-top_small">
                    No Accounts Found
                </p>
            </template>

        </div>
    </lightning-card>
</template>
