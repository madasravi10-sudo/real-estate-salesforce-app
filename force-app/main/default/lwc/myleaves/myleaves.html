<template>
    <lightning-card >

      <div class="slds-p-horizontal_small slds-p-bottom_small slds-text-align_right">

        <lightning-button
            label="New Leave"
            title="New Leave"
            icon-name="utility:add"
            variant="brand"
            onclick={handleNewLeave}>
        </lightning-button>

    </div>


      <template lwc:if={showNewLeaveModal}> 
         <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
             <div class="slds-modal__container">
                <!-- Header --> <header class="slds-modal__header"> 
                  <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleNewCancel}>
                      <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"> 

                      </lightning-icon> </button> <h2 class="slds-text-heading_medium"> New Leave Request </h2> </header> <!-- Body -->
                       <div class="slds-modal__content slds-p-around_medium"> 
                        <lightning-record-edit-form object-api-name="Leave_Requests__c" onsuccess={handleNewSuccess} onsubmit={handleNewSubmit}
                         onerror={handleNewError}> <lightning-messages></lightning-messages> 
                         <!-- From Date -->
                          <lightning-input-field field-name="User__c" value={currentUserId} disabled>
                                     </lightning-input-field>
                         <lightning-input-field field-name="From_Date__c">
                            </lightning-input-field> <!-- To Date --> <lightning-input-field field-name="To_Date__c">
                               </lightning-input-field> <!-- Reason --> <lightning-input-field field-name="Reason__c">
                                  </lightning-input-field> <!-- User -->  <!-- Buttons --> <div class="slds-m-top_medium slds-text-align_right">
                                        <lightning-button label="Cancel" variant="neutral" onclick={handleNewCancel}> 

                                        </lightning-button> <lightning-button class="slds-m-left_small" type="submit" label="Save" variant="brand"> </lightning-button> 
                                       </div> </lightning-record-edit-form> </div> </div> </section> 
                                       <div class="slds-backdrop slds-backdrop_open"></div> </template>

        <lightning-datatable
            key-field="Id"
            data={myLeaves}
            columns={columns}
            onrowaction={handleRowAction}>
        </lightning-datatable>
        <template lwc:if={NoRecordsFound}>
            <div class="slds-align_absolute-center slds-p-around_small slds-text-heading_medium">No Records Found</div>
        </template>
    </lightning-card>
    <template lwc:if={showEditModal}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <!-- Modal Header -->
                <header class="slds-modal__header">

                    <button
                        class="slds-button slds-button_icon slds-modal__close"
                        title="Close"
                        onclick={handleCancel}>

                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small">
                        </lightning-icon>

                    </button>

                    <h2
                        id="modal-heading"
                        class="slds-text-heading_medium">
                        Edit Leave Request
                    </h2>

                </header>


                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-record-edit-form
                        record-id={selectedLeaveId}
                        object-api-name="Leave_Requests__c"
                        
                        onsuccess={handleSuccess}
                        onerror={handleError}>

                        <lightning-messages></lightning-messages>
                      <!-- User -->
                      <lightning-input-field
    field-name="User__c">
           </lightning-input-field>

                        <!-- From Date -->

                        <lightning-input-field
                            field-name="From_Date__c">
                        </lightning-input-field>


                        <!-- To Date -->

                        <lightning-input-field
                            field-name="To_Date__c">
                        </lightning-input-field>


                        <!-- Reason -->

                        <lightning-input-field
                            field-name="Reason__c">
                        </lightning-input-field>

                        <!-- Buttons -->

                        <div class="slds-m-top_medium slds-text-align_right">

                            <lightning-button
                                label="Cancel"
                                variant="neutral"
                                onclick={handleCancel}>
                            </lightning-button>

                            <lightning-button
                                class="slds-m-left_small"
                                type="submit"
                                label="Save"
                                variant="brand">
                            </lightning-button>

                        </div>

                    </lightning-record-edit-form>

                </div>

            </div>

        </section>


        <!-- Modal Background -->

        <div
            class="slds-backdrop slds-backdrop_open">
        </div>

    </template>
    
</template>
