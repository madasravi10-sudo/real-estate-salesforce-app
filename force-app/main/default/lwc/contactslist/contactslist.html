<template>
    <lightning-card title="Contact List with Lifecycle Hooks">
    <template if:true={contacts.length}>
    <ul>
    <template for:each={contacts} for:item="contact">
    <li key={contact.Id}>{contact.Name} - {contact.Email}</li>
    </template>
    </ul>
    </template>
    <template if:true={error}>
    <p style="color:red;">Error: {error}</p>
    </template>
    </lightning-card>
    </template>
