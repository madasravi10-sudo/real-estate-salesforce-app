<template>
    <lightning-card title="Dependent Picklist Example">

        <div class="slds-p-around_medium">

            <!-- Country -->
            <lightning-combobox
                label="Country"
                value={selectedCountry}
                options={countryOptions}
                onchange={handleCountryChange}>
            </lightning-combobox>

            <!-- State -->
            <lightning-combobox
                label="State"
                value={selectedState}
                options={stateOptions}
                onchange={handleStateChange}
                class="slds-m-top_medium">
            </lightning-combobox>

            <!-- City -->
            <lightning-combobox
                label="City"
                value={selectedCity}
                options={cityOptions}
                class="slds-m-top_medium">
            </lightning-combobox>

        </div>

    </lightning-card>
</template>
