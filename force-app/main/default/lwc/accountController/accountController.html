<template>
    <lightning-card title="Accounts Datatable">
        <div class="slds-m-around_medium">

            <!-- Data Table -->
            <template if:true={accounts.data}>
                <lightning-datatable
                    key-field="Id"
                    data={accounts.data}
                    columns={columns}>
                </lightning-datatable>
            </template>

            <!-- Error -->
            <template if:true={accounts.error}>
                <p class="slds-text-color_error">
                    Error loading account data
                </p>
            </template>

        </div>
    </lightning-card>
</template>
