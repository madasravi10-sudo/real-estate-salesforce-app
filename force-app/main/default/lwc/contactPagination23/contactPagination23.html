<template>
    <lightning-card title="Contact Pagination">

        <lightning-datatable
            key-field="Id"
            data={contacts}
            columns={columns}>
        </lightning-datatable>

        <div class="slds-m-around_medium slds-align_absolute-center">

            <lightning-button
                label="Previous"
                onclick={handlePrevious}
                disabled={disablePrevious}>
            </lightning-button>

            <span class="slds-m-horizontal_medium">
                Page {pageNumber}
            </span>

            <lightning-button
                label="Next"
                onclick={handleNext}>
            </lightning-button>

        </div>

    </lightning-card>
</template>
